# SWAT — AWS staging stack (SWAT-owned EC2 host; account 483272865959).
#
# This is NOT the self-hosted on-prem stack (see docker-compose.prod.yml for that,
# which keeps its own Postgres/Redis/MinIO/Nginx and stays platform-agnostic).
# Staging runs its OWN Caddy as the TLS edge and uses AWS RDS as the database.
# (Historically SWAT was a co-tenant on sekar's box and borrowed sekar's Caddy;
#  after the 2026-09 account migration SWAT owns the whole box, so the drop-in
#  merge into a foreign Caddyfile is gone.)
#
#   - Postgres        -> AWS RDS  (managed; instance `swat-staging`, database `swat_staging`)
#   - Object storage  -> AWS S3   (via the EC2 instance role; no keys on the host)
#   - TLS / 80,443    -> the `caddy` service below (infra/Caddyfile.staging), on the
#                        `edge` network with the app containers
#   - Redis           -> small in-stack container (sessions + BullMQ report jobs)
#
# The image registry is NOT hardcoded: `ECR_REGISTRY` is exported by the deploy
# (from the repo Variable of the same name). Pinning the account id here is what
# broke the sibling project's account migration — images pushed to the new account
# were pulled from the old one, failing with `no basic auth credentials`.
#
# Runtime env is materialized to /opt/swat/.env by infra/seed-env-from-ssm.sh
# (the single dotenvx private key, pulled from SSM at deploy time); everything else
# lives in the committed, ENCRYPTED infra/env/backend/.env.staging baked into the
# backend image and decrypted at boot via `dotenvx run`.
#
# Usage on the box:
#   ECR_REGISTRY=<acct>.dkr.ecr.<region>.amazonaws.com IMAGE_TAG=<git-sha> \
#     docker compose -f compose.staging.yml pull
#   ECR_REGISTRY=... IMAGE_TAG=<git-sha> docker compose -f compose.staging.yml up -d --wait

name: swat-staging

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  backend:
    image: ${ECR_REGISTRY}/swat-backend:${IMAGE_TAG:-staging}
    container_name: swat-backend
    # Decrypt the baked .env.staging (key from env_file) into process.env, then boot.
    command: ['sh', '-c', 'dotenvx run -f .env.staging -- node dist/main.js']
    env_file:
      - /opt/swat/.env
    # Service-name overrides win over the encrypted file so the in-stack Redis resolves.
    environment:
      NODE_ENV: production
      BE_PORT: '3000'
      REDIS_URL: redis://redis:6379
    expose:
      - '3000' # internal only; reached via the caddy service on the edge network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:3000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    mem_limit: 448m
    mem_reservation: 320m
    restart: unless-stopped
    logging: *default-logging
    networks: [edge, internal]

  web:
    image: ${ECR_REGISTRY}/swat-web:${IMAGE_TAG:-staging}
    container_name: swat-web
    environment:
      NODE_ENV: production
      PORT: '3001'
      HOSTNAME: '0.0.0.0'
    expose:
      - '3001' # internal only; reached via the caddy service on the edge network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:3001/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    mem_limit: 256m
    mem_reservation: 160m
    restart: unless-stopped
    logging: *default-logging
    networks: [edge]

  # Public user manual (Docusaurus static site → nginx). No DB/secrets. Reached via
  # the caddy service at docs.swat.wahyutrip.com (see infra/Caddyfile.staging).
  docs:
    image: ${ECR_REGISTRY}/swat-docs:${IMAGE_TAG:-staging}
    container_name: swat-docs
    expose:
      - '80' # internal only; reached via the caddy service on the edge network
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:80/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 64m
    mem_reservation: 32m
    restart: unless-stopped
    logging: *default-logging
    networks: [edge]

  # Database UI for staging support work. PUBLICLY REACHABLE, so it is deliberately
  # constrained: Caddy enforces HTTP basic auth in front of it (the bcrypt hash comes
  # from SSM at deploy time, never from the repo), it holds no credentials of its own
  # — whoever opens it still needs the database password — and it is pinned to a
  # digest-free but explicit major so an upstream :latest cannot silently change what
  # is exposed. Adminer has a history of RCE/SSRF advisories; if this stops being
  # needed, delete the service and the Caddy block rather than leaving it running.
  adminer:
    image: adminer:5
    container_name: swat-adminer
    # ADMINER_DEFAULT_SERVER prefills the RDS endpoint (written by
    # seed-env-from-ssm.sh, since it is only known after provisioning).
    env_file:
      - /opt/swat/.env
    environment:
      ADMINER_DESIGN: dracula
    expose:
      - '8080' # internal only; reached via caddy on the edge network
    healthcheck:
      test: ['CMD', 'php', '-r', "exit(@file_get_contents('http://127.0.0.1:8080/')===false?1:0);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 128m
    mem_reservation: 64m
    restart: unless-stopped
    logging: *default-logging
    networks: [edge]

  # TLS edge — SWAT owns it now (the box is no longer shared). Terminates 80/443,
  # auto-provisions Let's Encrypt certs for the three hostnames in Caddyfile.staging,
  # and reverse-proxies to the app containers by name over the `edge` network.
  # caddy_data holds the issued certs + ACME account key — NEVER prune this volume,
  # or every redeploy re-requests certs and hits Let's Encrypt rate limits.
  caddy:
    image: caddy:2-alpine
    container_name: swat-caddy
    # Supplies {env.ADMINER_BASIC_AUTH_HASH} to the Caddyfile.
    env_file:
      - /opt/swat/.env
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile.staging:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
      docs:
        condition: service_healthy
      adminer:
        condition: service_healthy
    mem_limit: 96m
    mem_reservation: 48m
    restart: unless-stopped
    logging: *default-logging
    networks: [edge]

  redis:
    image: redis:7-alpine
    container_name: swat-redis
    # noeviction (not allkeys-lru): BullMQ + sessions must never have keys evicted.
    # maxmemory stays under the container mem_limit (96m) to avoid OOM.
    command: redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 96m
    mem_reservation: 48m
    restart: unless-stopped
    logging: *default-logging
    networks: [internal]

networks:
  # Bridge joining caddy to the app containers, which it reaches by container name.
  # Owned by this compose file (it used to be an externally-created network shared
  # with the co-tenant project) — one less box-side prerequisite.
  edge:
    driver: bridge
  # Private to SWAT; isolates Redis from the edge.
  internal:
    driver: bridge

volumes:
  redis-data:
  # Issued TLS certs + the ACME account key. Must survive redeploys.
  caddy-data:
  caddy-config:
