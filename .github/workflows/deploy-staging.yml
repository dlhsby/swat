name: Deploy staging (AWS)

# Builds the SWAT backend + web + docs production images, pushes them to ECR,
# snapshots RDS, then deploys to SWAT's EC2 host via SSM Run Command (no SSH).
# Auth uses GitHub OIDC — no long-lived AWS keys in GitHub. Staging on AWS,
# on-prem prod stays platform-agnostic (docker-compose.prod.yml).
#
# Release flow (pushing to `main` NEVER deploys, to conserve Actions minutes):
#   feature branch → PR into `main` → pr-gate.yml `gate` check must pass → merge.
#   When `main` is UAT-ready, open a PR `main` → `staging` and merge it (or run this
#   workflow via "Run workflow"). A push to `staging` triggers THIS workflow: it
#   re-runs the quality gate, then pauses ONCE at `build-push` for `staging`
#   Environment approval, after which it builds + deploys straight through.
#
# The pnpm monorepo lives in the inner `revamp/` dir; the git repo root (and this
# workflow) sit at the OUTER dir, so Docker build contexts are `./revamp`.
#
# Required repo Variables (Settings → Secrets and variables → Actions → Variables):
#   AWS_REGION        ap-southeast-3
#   AWS_ROLE_ARN      arn:aws:iam::732343865225:role/swat-gha-deploy
#   ECR_REGISTRY      732343865225.dkr.ecr.ap-southeast-3.amazonaws.com
#                     (compose.staging.yml interpolates this — the registry is NEVER
#                      hardcoded there; pinning an account id in compose is what broke
#                      the sibling project's account migration)
#   ECR_BACKEND       $ECR_REGISTRY/swat-backend
#   ECR_WEB           $ECR_REGISTRY/swat-web
#   ECR_DOCS          $ECR_REGISTRY/swat-docs
#                     (docs user-manual image — all three ECR repos are created by
#                      infra/aws/provision-staging.sh; the deploy role has push-only
#                      ECR perms, not CreateRepository)
#   EC2_INSTANCE_ID   the SWAT staging box (see infra/aws/README.md)
#   RDS_INSTANCE_ID   swat-staging
# Required Environment Secret (staging environment):
#   WEB_DOTENV_PRIVATE_KEY   dotenvx key decrypting infra/env/web/.env.staging at build
# The `staging` Environment must have a Required reviewer (repo owner) so deploys are
# gated. Backend staging config lives in the encrypted infra/env/backend/.env.staging
# baked into the image; the box decrypts it at runtime with DOTENV_PRIVATE_KEY_STAGING
# fetched from SSM (/swat/staging/BE_DOTENV_PRIVATE_KEY).

on:
  push:
    branches: [staging]
  workflow_dispatch:

# Deny by default; each job opts into exactly what it needs.
permissions: {}

concurrency:
  group: deploy-staging
  cancel-in-progress: false

defaults:
  run:
    working-directory: revamp

jobs:
  # Final safety gate on the release commit — the SAME reusable suite the PR gate
  # runs (single source of truth). PRs into main/staging are already gated by
  # pr-gate.yml; this re-runs it on the merge commit before any image is built.
  # Grant contents:read here (top-level is {}) so the reusable workflow can check out.
  quality:
    permissions:
      contents: read
    uses: ./.github/workflows/quality.yml

  build-push:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Scoped to the staging environment so it can read WEB_DOTENV_PRIVATE_KEY. This is
    # the SINGLE approval gate for a release — the deploy job below is NOT environment-
    # scoped (it uses only repo Variables + OIDC), so the whole release is approved once,
    # here, before any image is built.
    environment: staging
    permissions:
      id-token: write
      contents: read
    outputs:
      sha: ${{ steps.vars.outputs.sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
        working-directory: .

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build & push backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./revamp
          file: ./revamp/infra/Dockerfile.backend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ vars.ECR_BACKEND }}:staging
            ${{ vars.ECR_BACKEND }}:${{ steps.vars.outputs.sha }}
          cache-from: type=gha,scope=swat-backend
          cache-to: type=gha,mode=max,scope=swat-backend

      - name: Build & push web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./revamp
          file: ./revamp/infra/Dockerfile.web
          platforms: linux/amd64
          push: true
          # NEXT_PUBLIC_* are decrypted from the committed encrypted
          # infra/env/web/.env.staging by dotenvx during `next build`. The private key
          # is a BuildKit secret — mounted only for the build RUN, never in a layer.
          build-args: |
            DOTENV_ENV=staging
          secrets: |
            dotenv_private_key=${{ secrets.WEB_DOTENV_PRIVATE_KEY }}
          tags: |
            ${{ vars.ECR_WEB }}:staging
            ${{ vars.ECR_WEB }}:${{ steps.vars.outputs.sha }}
          cache-from: type=gha,scope=swat-web
          cache-to: type=gha,mode=max,scope=swat-web

      - name: Build & push docs
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          # Docs is a standalone npm project (outside the pnpm workspace), so its
          # build context is ./revamp/apps/docs, not ./revamp. Site URLs are baked
          # at build time (static-site constants) from build args.
          context: ./revamp/apps/docs
          file: ./revamp/apps/docs/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            DOCS_URL=https://docs.swat.wahyutrip.com
            DOCS_BASE_URL=/
            APP_URL=https://swat.wahyutrip.com
          tags: |
            ${{ vars.ECR_DOCS }}:staging
            ${{ vars.ECR_DOCS }}:${{ steps.vars.outputs.sha }}
          cache-from: type=gha,scope=swat-docs
          cache-to: type=gha,mode=max,scope=swat-docs

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # NOT environment-scoped on purpose: it only uses repo Variables + OIDC (no env-level
    # secrets), and the OIDC trust is scoped to the staging branch/environment. Keeping it
    # off the environment means a release is approved ONCE (at build-push), not twice.
    permissions:
      id-token: write
      contents: read
    # Repo Variables are pulled into env (trusted, admin-set) so the run scripts reference
    # shell vars instead of inlining ${{ }} into the shell — no interpolation surface.
    env:
      SHA: ${{ needs.build-push.outputs.sha }}
      ECR_BACKEND: ${{ vars.ECR_BACKEND }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      RDS_INSTANCE_ID: ${{ vars.RDS_INSTANCE_ID }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Pre-deploy RDS snapshot
        run: |
          set -euo pipefail
          SNAP="swat-staging-predeploy-${SHA}-$(date +%Y%m%d%H%M%S)"
          aws rds create-db-snapshot \
            --db-instance-identifier "$RDS_INSTANCE_ID" \
            --db-snapshot-identifier "$SNAP" >/dev/null
          echo "Snapshot initiated: $SNAP"

          # Retention: keep only the newest RETAIN pre-deploy snapshots, delete the
          # rest — runs every deploy so they can't pile up (manual RDS snapshot
          # storage is billed beyond the free 20 GB). Automated daily backups remain
          # the point-in-time recovery path. Scoped to swat-staging-* only (a habit
          # kept from the shared-account days). Failures are swallowed so a missing
          # permission can't break a deploy — the role needs rds:DeleteDBSnapshot.
          RETAIN=1
          OLD=$(aws rds describe-db-snapshots \
                  --snapshot-type manual \
                  --query "reverse(sort_by(DBSnapshots[?starts_with(DBSnapshotIdentifier, 'swat-staging-')], &SnapshotCreateTime))[${RETAIN}:].DBSnapshotIdentifier" \
                  --output text)
          for s in $OLD; do
            echo "Pruning old pre-deploy snapshot: $s"
            aws rds delete-db-snapshot --db-snapshot-identifier "$s" >/dev/null || true
          done

      - name: Deploy via SSM (seed env, pull, migrate, up --wait)
        run: |
          set -euo pipefail
          COMPOSE_B64=$(base64 -w0 infra/compose.staging.yml)
          SEED_B64=$(base64 -w0 infra/seed-env-from-ssm.sh)
          CADDY_B64=$(base64 -w0 infra/Caddyfile.staging)

          BOX=$(cat <<EOF
          set -e
          mkdir -p ~/swat/infra
          echo $COMPOSE_B64 | base64 -d > ~/swat/infra/compose.staging.yml
          echo $SEED_B64 | base64 -d > ~/swat/infra/seed-env-from-ssm.sh
          echo $CADDY_B64 | base64 -d > ~/swat/infra/Caddyfile.staging
          # SWAT owns the whole box now: the `caddy` service in compose.staging.yml
          # binds 80/443 and reads the Caddyfile written above (bind-mounted, so a
          # `up --force-recreate` picks up changes). The old drop-in-into-a-foreign-
          # Caddyfile merge and the externally-created `edge` network are both gone —
          # the compose file owns the network.
          bash ~/swat/infra/seed-env-from-ssm.sh
          cd ~/swat/infra
          export IMAGE_TAG=$SHA
          # Registry is a repo Variable, never hardcoded in compose.staging.yml —
          # pinning an account id there is what broke the sibling project's account
          # migration (pull from the dead account: "no basic auth credentials").
          export ECR_REGISTRY=$ECR_REGISTRY
          # Reclaim disk BEFORE the pull: per-SHA images + build cache accumulate
          # across deploys and once they fill '/' the pull fails with "no space left
          # on device". Prune all images not used by a RUNNING container (so the live
          # stack is safe) + the builder cache. Volumes are untouched, which is what
          # keeps the issued TLS certs in the `caddy-data` volume alive.
          docker image prune -af
          docker builder prune -af
          docker compose -f compose.staging.yml pull --quiet
          # -T: no TTY/stdin (compose run would otherwise consume the rest of the script).
          # Apply Prisma migrations (deploy — never migrate dev on partitioned tables),
          # decrypting DATABASE_URL from the baked encrypted .env.staging.
          docker compose -f compose.staging.yml run --rm --no-deps -T backend \
            sh -c "dotenvx run -f .env.staging -- npx prisma migrate deploy"
          docker compose -f compose.staging.yml up -d --force-recreate --wait
          RUNNING_BE=\$(docker inspect swat-backend --format '{{.Config.Image}}')
          EXPECT_BE="${ECR_BACKEND}:\$IMAGE_TAG"
          echo "running backend image: \$RUNNING_BE (expected \$EXPECT_BE)"
          test "\$RUNNING_BE" = "\$EXPECT_BE"
          echo "DEPLOY-VERIFIED \$IMAGE_TAG"
          EOF
          )
          RUN_B64=$(printf '%s' "$BOX" | base64 -w0)
          # base64 output is JSON-safe; build params.json with jq so the payload can
          # never break the document structure regardless of the script content.
          jq -n --arg cmd "runuser -l ec2-user -c \"echo $RUN_B64 | base64 -d > /tmp/swat-deploy.sh && bash /tmp/swat-deploy.sh\"" \
            '{commands: [$cmd]}' > params.json

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy-staging ${SHA}" \
            --parameters file://params.json \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"
          STATUS=InProgress
          for i in $(seq 1 84); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$EC2_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 5
          done
          echo "::group::stdout"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$EC2_INSTANCE_ID" --query StandardOutputContent --output text | tail -60
          echo "::endgroup::"
          echo "::group::stderr"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$EC2_INSTANCE_ID" --query StandardErrorContent --output text | tail -60
          echo "::endgroup::"
          echo "Deploy status: $STATUS"
          test "$STATUS" = "Success"

      - name: Smoke test
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            if curl -fsS --retry 3 https://api.swat.wahyutrip.com/health >/dev/null; then
              echo "API healthy"; break
            fi
            echo "waiting for API... ($i)"; sleep 6
          done
          curl -fsS https://api.swat.wahyutrip.com/health
          curl -fsSI --retry 5 --retry-delay 6 https://swat.wahyutrip.com/ | head -1
          # Docs site — public, no auth. Retry covers first-time Let's Encrypt
          # issuance for the new docs.swat.wahyutrip.com host.
          curl -fsSI --retry 5 --retry-delay 6 https://docs.swat.wahyutrip.com/ | head -1
